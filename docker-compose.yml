# Portainer stack ("Stacks" -> "Add stack" -> "Repository").
services:
  goodwe-dashboard:
    build: .
    image: goodwe-dashboard:latest
    container_name: goodwe-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"           # web page: http://<host-ip>:8080
    volumes:
      - goodwe-dashboard-data:/data   # saved IP and change log
    environment:
      # Phase 1: read-only. Set to "true" only when you want to try writes.
      WRITES_ENABLED: "false"
      # Optional: initial inverter IP (can also be changed from the page)
      INVERTER_HOST: ""
      # Optional: simple login (HTTP Basic). Empty = no password.
      PORTAL_USER: "admin"
      PORTAL_PASSWORD: ""
      TZ: "Europe/Rome"

volumes:
  goodwe-dashboard-data:
